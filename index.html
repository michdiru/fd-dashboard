<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фитнес-департамент — дашборд</title>
<style>
  :root{
    --bg: #f5f5f7;
    --bg-2: #ffffff;
    --card: rgba(255,255,255,0.68);
    --card-border: rgba(255,255,255,0.7);
    --card-shadow: 0 24px 60px -20px rgba(20,20,40,0.18), 0 2px 8px rgba(20,20,40,0.05);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --track: rgba(0,0,0,0.07);
    --divider: rgba(0,0,0,0.08);
    --pill-good-bg: rgba(48,209,88,0.14);
    --pill-good-fg: #1f8a3d;
    --pill-warn-bg: rgba(255,159,10,0.16);
    --pill-warn-fg: #b06400;
    --pill-bad-bg: rgba(255,69,58,0.14);
    --pill-bad-fg: #d70015;
    --blob-op: 0.30;

    --blue:   #0a84ff;
    --indigo: #5e5ce6;
    --purple: #bf5af2;
    --magenta:#ff2d89;
    --orange: #ff9f0a;
    --yellow: #d6a206;
    --teal:   #64d2ff;
    --green:  #30d158;
    --red:    #ff453a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --bg-2: #0a0a0c;
      --card: rgba(28,28,32,0.62);
      --card-border: rgba(255,255,255,0.09);
      --card-shadow: 0 24px 60px -20px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.3);
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #86868b;
      --track: rgba(255,255,255,0.09);
      --divider: rgba(255,255,255,0.09);
      --pill-good-bg: rgba(48,209,88,0.18);
      --pill-good-fg: #4fe07a;
      --pill-warn-bg: rgba(255,159,10,0.2);
      --pill-warn-fg: #ffb340;
      --pill-bad-bg: rgba(255,69,58,0.2);
      --pill-bad-fg: #ff6961;
      --blob-op: 0.4;
      --yellow: #ffd60a;
    }
  }
  :root[data-theme="dark"]{
    --bg: #000000;
    --bg-2: #0a0a0c;
    --card: rgba(28,28,32,0.62);
    --card-border: rgba(255,255,255,0.09);
    --card-shadow: 0 24px 60px -20px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.3);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --track: rgba(255,255,255,0.09);
    --divider: rgba(255,255,255,0.09);
    --pill-good-bg: rgba(48,209,88,0.18);
    --pill-good-fg: #4fe07a;
    --pill-warn-bg: rgba(255,159,10,0.2);
    --pill-warn-fg: #ffb340;
    --pill-bad-bg: rgba(255,69,58,0.2);
    --pill-bad-fg: #ff6961;
    --blob-op: 0.4;
    --yellow: #ffd60a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}

  .blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:var(--blob-op);}
  .blob.b1{width:560px;height:560px;top:-160px;left:-120px;background:var(--blue);}
  .blob.b2{width:520px;height:520px;top:120px;right:-160px;background:var(--purple);}
  .blob.b3{width:480px;height:480px;bottom:-200px;left:32%;background:var(--teal);}

  /* фиксированный макет 1600x900, масштабируется скриптом под окно */
  .stage-wrap{position:relative;z-index:1;width:100vw;height:100vh;overflow:hidden;}
  .stage{width:1600px;height:900px;padding:26px 34px 20px;transform-origin:top left;display:flex;flex-direction:column;}

  .masthead{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex:0 0 auto;}
  .title{font-size:27px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;}
  .title .grad{background:linear-gradient(90deg,var(--blue),var(--purple) 55%,var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .m-sub{font-size:13px;color:var(--text-2);}
  .m-upd{margin-left:auto;font-size:11.5px;color:var(--text-3);}

  .cols{display:flex;gap:22px;flex:1 1 auto;min-height:0;}
  .col-l{flex:0 0 852px;display:flex;flex-direction:column;gap:16px;min-height:0;}
  .col-r{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}

  .card{
    background:var(--card);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--card-border);
    border-radius:22px;
    box-shadow:var(--card-shadow);
  }

  /* hero */
  .hero{display:flex;align-items:center;gap:22px;padding:16px 22px;flex:0 0 auto;}
  .ring-wrap{position:relative;flex:0 0 auto;width:104px;height:104px;}
  .ring-wrap svg{display:block;}
  .ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;}
  .hero-cap{font-size:12px;font-weight:600;color:var(--text-2);}
  .hero-big{font-size:20px;font-weight:800;margin-top:2px;}
  .hero-big small{font-size:12px;font-weight:600;color:var(--text-3);}
  .hero-cells{display:flex;gap:0;flex:1 1 auto;justify-content:space-around;}
  .hero-cell{padding:0 14px;}
  .hero-cell + .hero-cell{border-left:1px solid var(--divider);}
  .delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;}
  .delta.up{color:var(--green);} .delta.down{color:var(--red);}

  /* table */
  .tbl-card{padding:6px 18px 10px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  table{width:100%;border-collapse:collapse;}
  thead th{font-size:9.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:8px 7px 6px;border-bottom:1px solid var(--divider);white-space:nowrap;}
  thead tr.grp th{text-align:center;padding:8px 7px 2px;color:var(--text-2);border-bottom:none;font-size:10px;}
  thead th.grp-sep, td.grp-sep{border-left:1px solid var(--divider);}
  thead th.dept-h{text-align:left;}
  td{padding:8.5px 7px;font-size:13px;text-align:right;border-bottom:1px solid var(--divider);white-space:nowrap;}
  td.dept{text-align:left;font-weight:700;}
  td.dept .dept-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;}
  tbody tr:last-child td{border-bottom:none;}
  tfoot td{font-weight:800;border-top:1px solid var(--divider);border-bottom:none;}
  .muted{color:var(--text-3);}
  .st-conv{display:block;font-size:9px;color:var(--text-3);font-weight:600;margin-top:1px;}

  .pill{display:inline-flex;align-items:center;justify-content:center;padding:2.5px 8px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .pill.good{background:var(--pill-good-bg);color:var(--pill-good-fg);}
  .pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-fg);}
  .pill.bad{background:var(--pill-bad-bg);color:var(--pill-bad-fg);}

  .foot{font-size:10px;color:var(--text-3);margin-top:10px;line-height:1.45;flex:0 0 auto;}

  /* trainer panels */
  .lb-head{display:flex;align-items:baseline;gap:10px;margin:2px 2px 10px;flex:0 0 auto;}
  .lb-title{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .lb-sub{font-size:11.5px;color:var(--text-3);}
  .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1 1 auto;min-height:0;grid-auto-rows:min-content;}
  .lb-panel{padding:12px 16px 12px;}
  .lb-panel-title{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:800;margin-bottom:8px;}
  .lb-panel-title .sw{width:8px;height:8px;border-radius:50%;flex:0 0 auto;align-self:center;}
  .lb-panel-title .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-2);}
  .rank-list{display:flex;flex-direction:column;gap:5.5px;}
  .rank-row{display:grid;grid-template-columns:15px 128px 1fr 26px;align-items:center;gap:8px;}
  .rank-num{font-size:10px;font-weight:800;color:var(--text-3);text-align:right;}
  .rank-row.medal .rank-num{color:var(--orange);}
  .rank-name{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-track{height:7px;border-radius:99px;background:var(--track);overflow:hidden;}
  .rank-fill{height:100%;border-radius:99px;}
  .rank-val{font-size:11px;font-weight:700;text-align:right;}
  .rank-more{font-size:10.5px;color:var(--text-3);margin-top:7px;}

  /* мобильная деградация: обычная колонка с прокруткой */
  @media (max-width: 899px){
    .stage-wrap{width:auto;height:auto;overflow:visible;}
    .stage{width:auto;height:auto;transform:none !important;padding:20px 14px 40px;}
    .cols{flex-direction:column;}
    .col-l{flex:auto;}
    .hero{flex-wrap:wrap;gap:14px;}
    .hero-cells{flex-wrap:wrap;justify-content:flex-start;gap:10px 0;}
    .title{font-size:22px;white-space:normal;}
    .masthead{flex-wrap:wrap;gap:6px;}
    .m-upd{margin-left:0;flex-basis:100%;}
    .tbl-card{overflow-x:auto;}
    table{min-width:640px;}
    .lb-grid{grid-template-columns:1fr;}
    .rank-row{grid-template-columns:15px 108px 1fr 26px;}
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <div class="stage-wrap"><div class="stage" id="stage">
    <div class="masthead">
      <div class="title">Показатели <span class="grad">фитнес-департамента</span></div>
      <div class="m-sub" id="periodLine"></div>
      <div class="m-upd" id="updLine"></div>
    </div>

    <div class="cols">
      <div class="col-l">
        <div class="card hero" id="hero"></div>
        <div class="card tbl-card">
          <table id="deptTable"></table>
          <div class="foot" id="footNote"></div>
        </div>
      </div>

      <div class="col-r">
        <div class="lb-head">
          <div class="lb-title">Рейтинг тренеров по СТ</div>
          <div class="lb-sub">по департаментам · число проведённых стартовых тренировок</div>
        </div>
        <div class="lb-grid" id="lbGrid"></div>
      </div>
    </div>
  </div></div>

  <script src="data.js"></script>
  <script>
  (function(){
    var D = window.DASH_DATA;
    if(!D){ document.getElementById('periodLine').textContent = 'Нет данных: не найден data.js'; return; }

    var DEPT_COLOR = {
      'ТЗ':'var(--blue)','ГП':'var(--indigo)','БК':'var(--purple)','ДЦ':'var(--yellow)',
      'Мероприятия ФД':'var(--teal)','Массаж':'var(--orange)','СМ':'var(--magenta)'
    };
    var PANEL_ORDER = ['ТЗ','ГП','БК','СМ','ДЦ','Массаж'];
    var PANEL_LIMIT = {'ТЗ':10,'ГП':10,'БК':6,'СМ':6,'ДЦ':4,'Массаж':4};

    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function mln(v){ return (v/1e6).toFixed(2); }
    function fmtInt(v){ return v.toLocaleString('ru-RU'); }
    function pill(p){
      if(p==null) return '<span class="muted">—</span>';
      var cls = p>=100?'good':(p>=70?'warn':'bad');
      return '<span class="pill '+cls+'">'+p+'%</span>';
    }
    function delta(d){
      if(d==null) return '<span class="muted">—</span>';
      var up = d>=0;
      return '<span class="delta '+(up?'up':'down')+'">'+(up?'▲':'▼')+' '+Math.abs(d).toFixed(1)+'%</span>';
    }

    document.getElementById('periodLine').textContent = D.period.from+' – '+D.period.to;
    document.getElementById('updLine').textContent = 'обновлено '+D.generated_at;

    /* hero */
    var t = D.totals;
    var R = 46, C = 2*Math.PI*R, off = C*(1-Math.min(t.real_pct,100)/100);
    document.getElementById('hero').innerHTML =
      '<div class="ring-wrap">'+
        '<svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Выполнение плана по реализации: '+t.real_pct+'%">'+
          '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="10"/>'+
          '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="url(#gr)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 52 52)"/>'+
          '<defs><linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%">'+
            '<stop offset="0%" stop-color="#64d2ff"/><stop offset="100%" stop-color="#5e5ce6"/>'+
          '</linearGradient></defs>'+
        '</svg><div class="ring-val num">'+t.real_pct+'%</div>'+
      '</div>'+
      '<div style="flex:0 0 auto"><div class="hero-cap">План по реализации, общий ФД</div>'+
        '<div class="hero-big num">'+mln(t.real)+' <small>из '+mln(t.real_plan)+' млн ₽</small></div>'+
        '<div style="font-size:12px;margin-top:3px;">'+delta(t.delta_pct)+' <span class="hero-cap" style="font-weight:600">к прошлому году</span></div>'+
      '</div>'+
      '<div class="hero-cells">'+
        '<div class="hero-cell"><div class="hero-cap">Стартовые (СТ)</div><div class="hero-big num">'+t.st+' <small>из '+t.st_plan+'</small></div><div style="margin-top:3px;">'+pill(t.st_pct)+'</div></div>'+
        '<div class="hero-cell"><div class="hero-cap">Персональные (ПТ)</div><div class="hero-big num">'+fmtInt(t.pt)+'</div></div>'+
        '<div class="hero-cell"><div class="hero-cap">Прошлый год</div><div class="hero-big num">'+mln(t.prev)+' <small>млн ₽</small></div></div>'+
      '</div>';

    /* table */
    var rows = D.departments.map(function(d){
      return '<tr>'+
        '<td class="dept"><span class="dept-dot" style="background:'+DEPT_COLOR[d.name]+'"></span>'+esc(d.name)+'</td>'+
        '<td class="num">'+(d.pt?fmtInt(d.pt):'<span class="muted">0</span>')+'</td>'+
        '<td class="num grp-sep">'+mln(d.real)+'</td>'+
        '<td>'+pill(d.real_pct)+'</td>'+
        '<td class="num">'+mln(d.prev)+'</td>'+
        '<td>'+delta(d.delta_pct)+'</td>'+
        '<td class="num grp-sep">'+(d.st!=null?d.st+'<span class="st-conv">план '+d.st_plan+'</span>':'<span class="muted">—</span>')+'</td>'+
        '<td>'+pill(d.st_pct)+'</td>'+
      '</tr>';
    }).join('');
    document.getElementById('deptTable').innerHTML =
      '<thead>'+
        '<tr class="grp"><th class="dept-h"></th><th></th><th colspan="4" class="grp-sep">Реализация</th><th colspan="2" class="grp-sep">СТ</th></tr>'+
        '<tr><th class="dept-h">Департамент</th><th>ПТ</th>'+
        '<th class="grp-sep">млн ₽</th><th>% плана</th><th>Прошлый год</th><th>Δ</th>'+
        '<th class="grp-sep">Кол-во</th><th>% плана</th></tr>'+
      '</thead><tbody>'+rows+'</tbody>'+
      '<tfoot><tr>'+
        '<td class="dept">ФД — итого</td><td class="num">'+fmtInt(t.pt)+'</td>'+
        '<td class="num grp-sep">'+mln(t.real)+'</td><td>'+pill(t.real_pct)+'</td>'+
        '<td class="num">'+mln(t.prev)+'</td><td>'+delta(t.delta_pct)+'</td>'+
        '<td class="num grp-sep">'+t.st+'<span class="st-conv">план '+t.st_plan+'</span></td><td>'+pill(t.st_pct)+'</td>'+
      '</tr></tfoot>';

    document.getElementById('footNote').textContent =
      '* Факт за '+D.period.from+'–'+D.period.to+' из выгрузок A&A; прошлый год — '+
      D.prev_period.from+'–'+D.prev_period.to+' из Google-таблицы. Восточные единоборства учтены в БК, '+
      'все статьи «мероприятия» суммированы в «Мероприятия ФД». Планы на месяц — data/plans.json.';

    /* trainer panels */
    document.getElementById('lbGrid').innerHTML = PANEL_ORDER.map(function(dep){
      var list = (D.trainers[dep]||[]);
      var lim = PANEL_LIMIT[dep]||6;
      var shown = list.slice(0,lim);
      var rest = list.slice(lim);
      var max = shown.length ? shown[0].st : 1;
      var col = DEPT_COLOR[dep];
      var d = null;
      for(var i=0;i<D.departments.length;i++) if(D.departments[i].name===dep) d=D.departments[i];
      var rowsH = shown.map(function(tr,i){
        var w = Math.max(6, Math.round(tr.st/max*100));
        return '<div class="rank-row'+(i<3?' medal':'')+'">'+
          '<div class="rank-num num">'+(i+1)+'</div>'+
          '<div class="rank-name" title="'+esc(tr.name)+'">'+esc(tr.name)+'</div>'+
          '<div class="rank-track"><div class="rank-fill" style="width:'+w+'%;background:'+col+';"></div></div>'+
          '<div class="rank-val num">'+tr.st+'</div>'+
        '</div>';
      }).join('');
      var more = '';
      if(rest.length){
        var restSum = rest.reduce(function(a,b){return a+b.st;},0);
        more = '<div class="rank-more">ещё '+rest.length+' тренеров · '+restSum+' СТ</div>';
      }
      return '<div class="card lb-panel">'+
        '<div class="lb-panel-title"><span class="sw" style="background:'+col+'"></span>'+esc(dep)+
          '<span class="cnt num">'+(d&&d.st!=null?d.st+' СТ':'')+(d&&d.st_pct!=null?' · '+d.st_pct+'% плана':'')+'</span></div>'+
        '<div class="rank-list">'+rowsH+'</div>'+more+
      '</div>';
    }).join('');

    /* масштабирование под окно */
    function fit(){
      var st = document.getElementById('stage');
      if(window.innerWidth < 900){ st.style.transform=''; return; }
      var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
      st.style.transform = 'scale('+s+')';
      st.style.marginLeft = Math.max(0,(window.innerWidth-1600*s)/2)+'px';
      st.style.marginTop  = Math.max(0,(window.innerHeight-900*s)/2)+'px';
    }
    fit();
    window.addEventListener('resize', fit);
  })();
  </script>
</body>
</html>
